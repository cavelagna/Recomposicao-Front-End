
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano Cartesiano Interativo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Plano Cartesiano Interativo</h1>

        <p>
            Clique em qualquer ponto do plano para descobrir suas coordenadas.
        </p>

        <div id="plano">

            <div class="eixo-x">Eixo X</div>
            <div class="eixo-y">Eixo Y</div>

        </div>

        <div class="painel">

            <h2>Coordenadas</h2>

            <p id="coordenadas">
                Clique em algum ponto do plano.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
